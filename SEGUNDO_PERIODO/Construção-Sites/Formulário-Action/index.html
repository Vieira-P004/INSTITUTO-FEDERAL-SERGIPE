<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form action="formulario01Envio.html" name="Cadastro" method="get" target="_blank">
        <label for="nome">Nome</label>
        <input type="text" name="nome" id="nome" placeholder="Digite seu Nome"><br><br>

        <label for="senha">Senha</label>
        <input type="password" name="Senha" id="Senha"><br><br>

        <label for="email">E-mail</label>
        <input type="email" name="email" id="email"><br><br>

        <label for="cidade">Cidade</label>
        <input type="radio" name="cidade" id="cidade" value="Aracaju">Aracaju <br>
        <input type="radio" name="cidade" id="cidade" value="Itabaiana">Itabaiana <br><br>

        <label for="transporte">Meio de Transporte</label><br>
        <input type="checkbox" name="transporte" id="transporte" value="Carro">Carro <br>
        <input type="checkbox" name="transporte" id="transporte" value="Moto">Moto <br>
        <input type="checkbox" name="transporte" id="transporte" value="Ônibus">Ônibus <BR></BR>

        <input type="submit" value="Enviar">
    </form>
</body>
</html>
